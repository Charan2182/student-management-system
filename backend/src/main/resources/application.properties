# Server Port (Set to 8085 to avoid conflict with Oracle TNSLSNR on 8080)
server.port=8085

# Spring Datasource Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration for Date formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
